<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Family Tree Viewer</title>
        <link rel="stylesheet" href="css/style.css" />
    </head>
    <body>
        <div class="header">
            <h1>Family Lineage</h1>
            <button id="edit-button">Edit</button>
        </div>

        <svg id="tree-container"></svg>

        <div id="edit-popup" class="popup-container" style="display: none;">
            <div class="popup-content">
                <span class="close-popup">&times;</span>
                <h2>Edit Access</h2>
                <div class="popup-section">
                    <h3>Enter Secret Code</h3>
                    <input type="password" id="secret-code" placeholder="Secret Code" />
                    <button id="submit-code">Enter</button>
                </div>
                <div class="popup-section">
                    <h3>Request Changes</h3>
                    <input type="email" id="user-email" placeholder="Your Email" />
                    <textarea id="change-request" placeholder="Describe your requested change..."></textarea>
                    <button id="send-request">Send</button>
                </div>
            </div>
        </div>

        <!-- JS libraries -->
        <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
        <script src="js/config.js"></script>
        <script src="js/main.js"></script>
        <script src="js/auth.js"></script>
    </body>
</html>
